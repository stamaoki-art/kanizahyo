<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>📍 撮影地点 緯度経度コピー＆地番図</title>

  <!-- Leaflet 地図ライブラリ -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      display: flex;
      flex-direction: column;
      background: #263238;
    }

    /* 🔐 ログイン画面オーバーレイ */
    #login-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #263238;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: white;
      padding: 24px 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 340px;
      color: #333;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .login-card h3 {
      text-align: center;
      margin-bottom: 16px;
      color: #1565c0;
      font-size: 18px;
    }
    .login-input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }
    #login-btn {
      width: 100%;
      padding: 13px;
      background: #1565c0;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    #login-btn:active { background: #0d47a1; }
    #login-btn:disabled { background: #90caf9; cursor: not-allowed; }
    #login-msg {
      color: #c62828;
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
      font-weight: bold;
      min-height: 18px;
      word-break: break-all;
    }

    /* 上部検索＆座標表示バー */
    #top-bar {
      background: #1565c0;
      color: white;
      padding: 8px 10px;
      z-index: 1001;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .search-row { display: flex; gap: 6px; }
    #search-input {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      background: rgba(255,255,255,0.95);
    }
    #search-btn {
      padding: 0 14px;
      border: none;
      border-radius: 6px;
      background: #0d47a1;
      color: white;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    #search-btn:active { background: #002171; }

    #coord-display {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 6px;
      padding: 6px 10px;
      text-align: center;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 0.5px;
      color: #fff;
      user-select: all;
    }

    #map-container { flex: 1; position: relative; width: 100%; height: 100%; }
    #map { width: 100%; height: 100%; }

    .crosshair-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 999;
      pointer-events: none;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .crosshair-wrap::before, .crosshair-wrap::after {
      content: "";
      position: absolute;
      background: #ff1744;
      box-shadow: 0 0 3px rgba(255,255,255,0.95);
    }
    .crosshair-wrap::before { width: 40px; height: 2px; }
    .crosshair-wrap::after { width: 2px; height: 40px; }
    .crosshair-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff1744;
      border: 1.5px solid white;
      z-index: 1000;
    }

    /* 大型GPSボタン（測位中は点滅アニメーション） */
    .gps-btn {
      background: white;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      cursor: pointer;
      border: 2px solid #1565c0;
      user-select: none;
    }
    .gps-btn:active { background: #e3f2fd; transform: scale(0.95); }
    .gps-btn.tracking {
      border-color: #ef6c00;
      background: #fff3e0;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 108, 0, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(239, 108, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 108, 0, 0); }
    }

    #bottom-bar {
      background: white;
      padding: 10px 10px 14px 10px;
      z-index: 1001;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .action-row { display: flex; gap: 8px; }
    #copy-btn {
      flex: 3;
      padding: 14px 8px;
      border: none;
      border-radius: 10px;
      background: #2e7d32;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(46, 125, 50, 0.35);
      transition: background 0.15s, transform 0.1s;
    }
    #copy-btn:active { transform: scale(0.98); background: #1b5e20; }
    #copy-btn.copied { background: #0277bd; }
    #chiban-btn {
      flex: 2;
      padding: 14px 8px;
      border: none;
      border-radius: 10px;
      background: #ef6c00;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(239, 108, 0, 0.35);
      transition: background 0.15s, transform 0.1s;
    }
    #chiban-btn:active { transform: scale(0.98); background: #e65100; }
    #last-copied {
      font-size: 12px;
      color: #546e7a;
      text-align: center;
      min-height: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- 🔐 ログイン画面 -->
  <div id="login-screen">
    <div class="login-card">
      <h3>📍 現場ツール ログイン</h3>
      <input type="text" id="login-id" class="login-input" placeholder="IDを入力" autocomplete="username">
      <input type="password" id="login-pass" class="login-input" placeholder="パスワード" autocomplete="current-password">
      <button id="login-btn" onclick="attemptLogin(false)">ログイン</button>
      <div id="login-msg"></div>
    </div>
  </div>

  <!-- 上部バー -->
  <div id="top-bar">
    <div class="search-row">
      <input type="text" id="search-input" placeholder="🔍 住所 または 緯度,経度 (例: 35.68, 139.76)">
      <button id="search-btn" onclick="handleSearch()">検索</button>
    </div>
    <div id="coord-display">35.681236, 139.767125</div>
  </div>

  <!-- 地図エリア -->
  <div id="map-container">
    <div id="map"></div>
    <div class="crosshair-wrap"><div class="crosshair-dot"></div></div>
  </div>

  <!-- 下部ボタン群 -->
  <div id="bottom-bar">
    <div class="action-row">
      <button id="copy-btn" onclick="copyCenterCoord()">📋 座標コピー</button>
      <button id="chiban-btn" onclick="openChibanMap()">🗺️ 地番図</button>
    </div>
    <div id="last-copied">地図を動かして赤い十字を合わせてください</div>
  </div>

  <script>
    // =========================================================================
    // 💡【重要】ここにあなたのGoogle Apps Script（ウェブアプリ）のURLを貼り付けてください！
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwgACE4MO8AGrVOtcNb3Z_Cut7ep7YdHI8oLwNIotZbbV4n2DG1kIuoXjsDA4iITOrLAQ/exec";
    // =========================================================================

    function unlockApp() {
      document.getElementById("login-screen").style.display = "none";
      setTimeout(() => { map.invalidateSize(); }, 100);
    }

    async function attemptLogin(isAuto = false) {
      const idInput = document.getElementById("login-id");
      const passInput = document.getElementById("login-pass");
      const msg = document.getElementById("login-msg");
      const btn = document.getElementById("login-btn");

      const id = idInput.value.trim();
      const pass = passInput.value.trim();

      if (!id || !pass) {
        if (!isAuto) msg.innerText = "IDとパスワードを入力してください";
        return;
      }

      btn.innerText = isAuto ? "認証確認中..." : "ログイン中...";
      btn.disabled = true;
      msg.innerText = "";

      try {
        const url = `${GAS_URL}?id=${encodeURIComponent(id)}&pass=${encodeURIComponent(pass)}`;
        const res = await fetch(url);
        const text = await res.text();
        
        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          msg.innerText = "⚠️ Google側でブロックされました（URL確認）";
          btn.innerText = "ログイン";
          btn.disabled = false;
          return;
        }

        if (data.success) {
          localStorage.setItem("pin_auth_id", id);
          localStorage.setItem("pin_auth_pass", pass);
          unlockApp();
        } else {
          localStorage.removeItem("pin_auth_id");
          localStorage.removeItem("pin_auth_pass");
          msg.innerText = "❌ " + data.msg;
          btn.innerText = "ログイン";
          btn.disabled = false;
        }
      } catch (err) {
        if (isAuto && localStorage.getItem("pin_auth_id")) {
          unlockApp();
        } else {
          msg.innerText = "通信エラー: " + err.message;
          btn.innerText = "ログイン";
          btn.disabled = false;
        }
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const savedId = localStorage.getItem("pin_auth_id");
      const savedPass = localStorage.getItem("pin_auth_pass");
      if (savedId && savedPass) {
        document.getElementById("login-id").value = savedId;
        document.getElementById("login-pass").value = savedPass;
        attemptLogin(true);
      }
    });

    document.getElementById("login-pass").addEventListener("keypress", (e) => {
      if (e.key === "Enter") attemptLogin(false);
    });

    // --- 🗺️ 地図・高精度GPS・座標検索・コピーロジック ---
    let initLat = 35.681236;
    let initLon = 139.767125;
    let initZoom = 17;
    try {
      const saved = JSON.parse(localStorage.getItem('pin_copy_last_view'));
      if (saved && saved.lat && saved.lon) {
        initLat = saved.lat;
        initLon = saved.lon;
        initZoom = saved.zoom || 17;
      }
    } catch(e) {}

    const map = L.map('map', { zoomControl: false }).setView([initLat, initLon], initZoom);
    L.control.zoom({ position: 'topleft' }).addTo(map);

    const gsiPhoto = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {
      maxNativeZoom: 18,
      maxZoom: 20,
      attribution: '国土地理院'
    }).addTo(map);

    const gsiStd = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
      maxNativeZoom: 18,
      maxZoom: 20,
      attribution: '国土地理院'
    });

    const gsiPale = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
      maxNativeZoom: 18,
      maxZoom: 20,
      attribution: '国土地理院'
    });

    L.control.layers(
      { "📡 航空写真": gsiPhoto, "🗺️ 標準地図": gsiStd, "⚪ 淡色地図": gsiPale },
      null,
      { position: 'topright' }
    ).addTo(map);

    let gpsBtnEl = null;
    const gpsControl = L.control({ position: 'bottomright' });
    gpsControl.onAdd = function() {
      const div = L.DomUtil.create('div', 'gps-btn');
      div.innerHTML = '🎯';
      div.title = '現在地へ精密移動';
      gpsBtnEl = div;
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.on(div, 'click', function(e) {
        L.DomEvent.stop(e);
        jumpToCurrentLocation();
      });
      return div;
    };
    gpsControl.addTo(map);

    let myLocMarker = null;
    let myLocCircle = null;
    let searchMarker = null;
    let currentCoordText = "";
    let gpsWatchId = null;
    let gpsStopTimer = null;

    function updateCenterDisplay() {
      const c = map.getCenter();
      currentCoordText = `${c.lat.toFixed(6)}, ${c.lng.toFixed(6)}`;
      document.getElementById('coord-display').innerText = currentCoordText;
    }

    map.on('move', updateCenterDisplay);
    map.on('moveend', () => {
      updateCenterDisplay();
      const c = map.getCenter();
      try {
        localStorage.setItem('pin_copy_last_view', JSON.stringify({
          lat: c.lat,
          lon: c.lng,
          zoom: map.getZoom()
        }));
      } catch(e) {}
    });

    map.on('dragstart', () => {
      if (gpsWatchId !== null) {
        stopGpsWatch("✋ 手動調整モードに切り替えました");
      }
    });

    updateCenterDisplay();

    function openChibanMap() {
      const c = map.getCenter();
      const url = `https://chiban.koaza.net/#18/${c.lat.toFixed(5)}/${c.lng.toFixed(5)}`;
      window.open(url, '_blank');
    }

    function copyCenterCoord() {
      const text = currentCoordText;
      const btn = document.getElementById('copy-btn');
      const status = document.getElementById('last-copied');

      const onSuccess = () => {
        btn.classList.add('copied');
        btn.innerText = `✅ コピー完了！`;
        status.innerText = `コピー済み: ${text}`;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerText = `📋 座標コピー`;
        }, 1800);
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(onSuccess).catch(() => fallbackCopy(text, onSuccess));
      } else {
        fallbackCopy(text, onSuccess);
      }
    }

    function fallbackCopy(text, callback) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        callback();
      } catch(e) {
        alert("コピーに失敗しました。上の数字を長押ししてコピーしてください:\n" + text);
      }
      document.body.removeChild(ta);
    }

    function stopGpsWatch(msgText) {
      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
      }
      if (gpsStopTimer !== null) {
        clearTimeout(gpsStopTimer);
        gpsStopTimer = null;
      }
      if (gpsBtnEl) gpsBtnEl.classList.remove('tracking');
      if (msgText) {
        document.getElementById('last-copied').innerText = msgText;
      }
    }

    function jumpToCurrentLocation() {
      const status = document.getElementById('last-copied');
      if (!navigator.geolocation) {
        alert("お使いのブラウザはGPSに対応していません。");
        return;
      }

      stopGpsWatch();
      if (gpsBtnEl) gpsBtnEl.classList.add('tracking');
      status.innerText = "🛰️ GPS衛星を捕捉中...（最大10秒間絞り込み）";

      let bestAccuracy = Infinity;
      let latestAcc = null;

      gpsWatchId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const acc = pos.coords.accuracy;
          latestAcc = Math.round(acc);

          if (acc <= bestAccuracy) {
            bestAccuracy = acc;
            const targetZoom = acc <= 15 ? 19 : 18;
            map.setView([lat, lon], targetZoom);

            if (myLocMarker) map.removeLayer(myLocMarker);
            if (myLocCircle) map.removeLayer(myLocCircle);

            myLocCircle = L.circle([lat, lon], {
              radius: acc,
              color: "#0288d1",
              weight: 1,
              fillColor: "#03a9f4",
              fillOpacity: 0.18
            }).addTo(map);

            myLocMarker = L.circleMarker([lat, lon], {
              radius: 8,
              fillColor: "#0288d1",
              color: "#ffffff",
              weight: 3,
              fillOpacity: 1
            }).bindPopup(`📍 現在地（誤差約${latestAcc}m）`).addTo(map);

            if (acc <= 6) {
              stopGpsWatch(`🎯 高精度ロック完了！（誤差約${latestAcc}m）`);
            } else {
              status.innerText = `🛰️ 精密測位中... 現在誤差: 約${latestAcc}m（さらに絞り込み中）`;
            }
          }
        },
        (err) => {
          stopGpsWatch("⚠️ 位置情報を取得できませんでした");
          alert("現在地を取得できませんでした。スマホの「正確な位置情報」設定をご確認ください。");
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );

      gpsStopTimer = setTimeout(() => {
        if (gpsWatchId !== null) {
          const finalMsg = latestAcc !== null
            ? `✅ 現在地確定（誤差約${Math.round(bestAccuracy)}m）`
            : "⚠️ タイムアウトしました";
          stopGpsWatch(finalMsg);
        }
      }, 10000);
    }

    // ★ 入力文字列から座標を抽出するパーサー（全角・逆順・URL貼付対応）
    function parseSearchCoord(rawInput) {
      const normalized = rawInput
        .replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
        .replace(/．/g, '.')
        .replace(/，/g, ',')
        .replace(/－/g, '-')
        .replace(/ /g, ' ')
        .trim();

      // 住所の番地「1-2-3」と誤認しないよう、小数点を含む数値を2つ抽出
      const matches = normalized.match(/[-+]?\d+\.\d+/g);
      if (matches && matches.length >= 2) {
        let n1 = parseFloat(matches[0]);
        let n2 = parseFloat(matches[1]);

        // 日本付近の経度・緯度逆転自動補正 (経度120~155, 緯度20~50)
        if (n1 >= 120 && n1 <= 155 && n2 >= 20 && n2 <= 50) {
          return { lat: n2, lon: n1 };
        }
        if (Math.abs(n1) <= 90 && Math.abs(n2) <= 180) {
          return { lat: n1, lon: n2 };
        }
      }
      return null;
    }

    // ★ ハイブリッド検索（座標なら即ジャンプ、文字なら住所検索）
    async function handleSearch() {
      const q = document.getElementById('search-input').value.trim();
      if (!q) return;

      stopGpsWatch();
      const status = document.getElementById('last-copied');

      // 1. まず座標入力かどうかチェック
      const coord = parseSearchCoord(q);
      if (coord) {
        map.setView([coord.lat, coord.lon], 19);

        if (searchMarker) map.removeLayer(searchMarker);
        searchMarker = L.circleMarker([coord.lat, coord.lon], {
          radius: 9,
          fillColor: "#ef6c00",
          color: "#ffffff",
          weight: 3,
          fillOpacity: 1
        }).bindPopup(`📌 検索座標<br>${coord.lat.toFixed(6)}, ${coord.lon.toFixed(6)}`).addTo(map).openPopup();

        status.innerText = `📌 座標へ移動しました: ${coord.lat.toFixed(6)}, ${coord.lon.toFixed(6)}`;
        document.getElementById('search-input').blur(); // スマホのキーボードを閉じる
        return;
      }

      // 2. 座標でなければ国土地理院APIで住所・施設名検索
      status.innerText = "🔍 住所検索中...";
      try {
        const res = await fetch(`https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        if (data && data.length > 0 && data[0].geometry) {
          const coords = data[0].geometry.coordinates;
          const lat = coords[1];
          const lon = coords[0];
          const title = data[0].properties.title || q;

          map.setView([lat, lon], 18);

          if (searchMarker) map.removeLayer(searchMarker);
          searchMarker = L.circleMarker([lat, lon], {
            radius: 9,
            fillColor: "#ef6c00",
            color: "#ffffff",
            weight: 3,
            fillOpacity: 1
          }).bindPopup(`📌 ${title}`).addTo(map).openPopup();

          status.innerText = `移動完了: ${title}`;
          document.getElementById('search-input').blur();
        } else {
          status.innerText = "住所・施設が見つかりませんでした";
          alert("住所・施設が見つかりませんでした。");
        }
      } catch(e) {
        status.innerText = "検索エラーが発生しました";
      }
    }

    document.getElementById('search-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') handleSearch();
    });
  </script>
</body>
</html>

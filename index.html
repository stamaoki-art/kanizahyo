<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>📍 撮影地点 登録＆履歴マップ</title>

  <!-- Leaflet 地図ライブラリ -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- SheetJS Excel(.xlsx)出力ライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      display: flex;
      flex-direction: column;
      background: #263238;
    }

    /* 🔐 ログイン画面オーバーレイ */
    #login-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #263238;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: white;
      padding: 24px 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 340px;
      color: #333;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .login-card h3 {
      text-align: center;
      margin-bottom: 16px;
      color: #1565c0;
      font-size: 18px;
    }
    .login-input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }
    #login-btn {
      width: 100%;
      padding: 13px;
      background: #1565c0;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    #login-btn:active { background: #0d47a1; }
    #login-btn:disabled { background: #90caf9; cursor: not-allowed; }
    #login-msg {
      color: #c62828;
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
      font-weight: bold;
      min-height: 18px;
      word-break: break-all;
    }

    /* 📅 カレンダーモーダル */
    #calendar-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      z-index: 5000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .cal-card {
      background: white;
      border-radius: 14px;
      width: 100%;
      max-width: 360px;
      padding: 16px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.45);
      color: #263238;
    }
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .cal-nav-btn {
      background: #e3f2fd;
      border: none;
      color: #1565c0;
      font-weight: bold;
      font-size: 16px;
      width: 38px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
    }
    .cal-nav-btn:active { background: #bbdefb; }
    #cal-month-title {
      font-size: 17px;
      font-weight: bold;
      color: #1565c0;
    }
    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #546e7a;
    }
    .cal-weekdays div:first-child { color: #d32f2f; }
    .cal-weekdays div:last-child { color: #1976d2; }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .cal-cell {
      aspect-ratio: 1 / 1.05;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      position: relative;
      border: 1px solid transparent;
      user-select: none;
    }
    .cal-cell.empty { background: transparent; }
    .cal-cell.no-data {
      color: #b0bec5;
      background: #fafafa;
      cursor: default;
    }
    .cal-cell.has-data {
      background: #e8f5e9;
      border: 1.5px solid #2e7d32;
      color: #1b5e20;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(46, 125, 50, 0.2);
    }
    .cal-cell.has-data:active {
      transform: scale(0.94);
      background: #c8e6c9;
    }
    .cal-cell.selected {
      background: #2e7d32 !important;
      color: #ffffff !important;
      border-color: #1b5e20 !important;
    }
    .cal-cell.selected .cal-badge { color: #c8e6c9 !important; }
    .cal-cell.is-today { box-shadow: inset 0 0 0 2px #1565c0; }
    .cal-badge {
      font-size: 10px;
      line-height: 1;
      margin-top: 2px;
      color: #2e7d32;
      font-weight: bold;
    }
    .cal-legend {
      margin-top: 10px;
      font-size: 11px;
      color: #546e7a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .legend-dot {
      display: inline-block;
      width: 11px;
      height: 11px;
      background: #e8f5e9;
      border: 1.5px solid #2e7d32;
      border-radius: 3px;
      vertical-align: middle;
      margin-right: 4px;
    }
    .cal-footer {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }
    .cal-footer button {
      flex: 1;
      padding: 10px 6px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .cal-btn-today { background: #e3f2fd; color: #1565c0; }
    .cal-btn-close { background: #eceff1; color: #37474f; }

    /* 上部検索＆座標＆履歴バー */
    #top-bar {
      background: #1565c0;
      color: white;
      padding: 8px 10px;
      z-index: 1001;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .search-row { display: flex; gap: 6px; }
    #search-input {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      background: rgba(255,255,255,0.95);
    }
    #search-btn {
      padding: 0 14px;
      border: none;
      border-radius: 6px;
      background: #0d47a1;
      color: white;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    #search-btn:active { background: #002171; }

    .status-row {
      display: flex;
      gap: 5px;
      align-items: stretch;
    }
    #coord-display {
      flex: 1;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 6px;
      padding: 6px 6px;
      text-align: center;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 13px;
      font-weight: bold;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: all;
      white-space: nowrap;
    }
    #history-select {
      padding: 6px 6px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.4);
      background: #0d47a1;
      color: white;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      max-width: 118px;
    }
    #calendar-btn {
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.45);
      background: #0d47a1;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #calendar-btn:active { background: #002171; }
    #calendar-btn.active-date {
      background: #2e7d32;
      border-color: #a5d6a7;
    }

    #map-container { flex: 1; position: relative; width: 100%; height: 100%; }
    #map { width: 100%; height: 100%; }

    .crosshair-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 999;
      pointer-events: none;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .crosshair-wrap::before, .crosshair-wrap::after {
      content: "";
      position: absolute;
      background: #ff1744;
      box-shadow: 0 0 3px rgba(255,255,255,0.95);
    }
    .crosshair-wrap::before { width: 40px; height: 2px; }
    .crosshair-wrap::after { width: 2px; height: 40px; }
    .crosshair-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff1744;
      border: 1.5px solid white;
      z-index: 1000;
    }

    /* 大型GPSボタン */
    .gps-btn {
      background: white;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      cursor: pointer;
      border: 2px solid #1565c0;
      user-select: none;
    }
    .gps-btn:active { background: #e3f2fd; transform: scale(0.95); }
    .gps-btn.tracking {
      border-color: #ef6c00;
      background: #fff3e0;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 108, 0, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(239, 108, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 108, 0, 0); }
    }

    /* 登録済みピン用ラベルバッジ */
    .history-label {
      background: rgba(27, 94, 32, 0.92);
      color: white;
      border: 1px solid white;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    /* 下部アクションパネル */
    #bottom-bar {
      background: white;
      padding: 8px 10px 12px 10px;
      z-index: 1001;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .register-row { display: flex; gap: 6px; }
    #manage-id-input {
      flex: 1;
      padding: 10px 12px;
      border: 2px solid #1565c0;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      background: #f5f9ff;
    }
    #manage-id-input:focus {
      outline: none;
      background: #fff;
      border-color: #0d47a1;
    }
    #register-btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #1565c0;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(21, 101, 192, 0.35);
      white-space: nowrap;
    }
    #register-btn:active { transform: scale(0.97); background: #0d47a1; }
    #register-btn:disabled { background: #90caf9; cursor: not-allowed; }

    .action-row { display: flex; gap: 6px; }
    .sub-btn {
      flex: 1;
      padding: 11px 4px;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .sub-btn:active { transform: scale(0.97); }
    #copy-btn { background: #2e7d32; }
    #copy-btn:active { background: #1b5e20; }
    #copy-btn.copied { background: #0277bd; }
    #chiban-btn { background: #ef6c00; }
    #chiban-btn:active { background: #e65100; }
    #export-btn { background: #00695c; }
    #export-btn:active { background: #004d40; }

    #last-copied {
      font-size: 12px;
      color: #546e7a;
      text-align: center;
      min-height: 16px;
      font-weight: bold;
      word-break: break-all;
    }

    .popup-btn {
      margin-top: 6px;
      padding: 6px 8px;
      border: none;
      border-radius: 4px;
      background: #1565c0;
      color: white;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    .popup-btn:active { opacity: 0.85; }
    .popup-btn-del {
      margin-top: 8px;
      background: #c62828;
    }
  </style>
</head>
<body>

  <!-- 🔐 ログイン画面 -->
  <div id="login-screen">
    <div class="login-card">
      <h3>📍 現場ツール ログイン</h3>
      <input type="text" id="login-id" class="login-input" placeholder="IDを入力" autocomplete="username">
      <input type="password" id="login-pass" class="login-input" placeholder="パスワード" autocomplete="current-password">
      <button id="login-btn" onclick="attemptLogin(false)">ログイン</button>
      <div id="login-msg"></div>
    </div>
  </div>

  <!-- 📅 色付きカレンダーモーダル -->
  <div id="calendar-modal" onclick="closeCalendarIfBackdrop(event)">
    <div class="cal-card">
      <div class="cal-header">
        <button class="cal-nav-btn" onclick="changeCalMonth(-1)">◀</button>
        <div id="cal-month-title">2026年 11月</div>
        <button class="cal-nav-btn" onclick="changeCalMonth(1)">▶</button>
      </div>
      <div class="cal-weekdays">
        <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-legend">
        <span><span class="legend-dot"></span>緑色の日は記録あり（数字は件数）</span>
        <span id="cal-total-badge"></span>
      </div>
      <div class="cal-footer">
        <button class="cal-btn-today" onclick="selectTodayFromCal()">📍 本日を表示</button>
        <button class="cal-btn-close" onclick="closeCalendar()">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 上部バー -->
  <div id="top-bar">
    <div class="search-row">
      <input type="text" id="search-input" placeholder="🔍 住所 または 緯度,経度">
      <button id="search-btn" onclick="handleSearch()">検索</button>
    </div>
    <div class="status-row">
      <div id="coord-display">35.681236, 139.767125</div>
      <select id="history-select" onchange="onPeriodSelectChange()">
        <option value="none">履歴: 非表示</option>
        <option value="today" selected>履歴: 本日</option>
        <option value="yesterday">履歴: 昨日</option>
        <option value="1week">過去1週間</option>
        <option value="1month">過去1か月</option>
        <option value="3months">過去3か月</option>
        <option value="1year">過去1年</option>
        <option value="all">履歴: 全部</option>
        <option value="custom_date" id="custom-date-opt" style="display:none;">📅 日付指定</option>
      </select>
      <button id="calendar-btn" onclick="openCalendar()" title="カレンダーで日付選択">📅</button>
    </div>
  </div>

  <!-- 地図エリア -->
  <div id="map-container">
    <div id="map"></div>
    <div class="crosshair-wrap"><div class="crosshair-dot"></div></div>
  </div>

  <!-- 下部ボタン群 -->
  <div id="bottom-bar">
    <div class="register-row">
      <input type="text" id="manage-id-input" placeholder="管理番号を入力 (例: A-101)">
      <button id="register-btn" onclick="registerSpot()">💾 登録</button>
    </div>

    <div class="action-row">
      <button id="copy-btn" class="sub-btn" onclick="copyCenterCoord()">📋 座標コピー</button>
      <button id="chiban-btn" class="sub-btn" onclick="openChibanMap()">🗺️ 地番図</button>
      <button id="export-btn" class="sub-btn" onclick="exportVisiblePinsToExcel()">📊 Excel出力</button>
    </div>
    <div id="last-copied">地図を動かして赤い十字を合わせてください</div>
  </div>

  <script>
    // =========================================================================
    // 💡【重要1】ログイン管理用スプレッドシートのGAS URL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbykbAEEHsAplk7ByKg_p78qEUE5G1H6Og1PMNdvvBZXMq6LYdG0R221VRslT6iAfSf-2g/exec";

    // 💡【重要2】記録シート用スプレッドシートのGAS URL（ログイン用とは別のURL！）
    const RECORD_GAS_URL = "https://script.google.com/macros/s/AKfycbxgsoY1igxXtwr-XV1Weylv_VG2LAvokl96ezDayB3Zfpq-3QrHr3gBmbLoPdXj9ORqxw/exec";
    // =========================================================================

    let allUserRecords = [];
    let currentVisibleRecords = [];
    let recordUidCounter = 0;
    let selectedDateKey = "";
    let calViewYear = new Date().getFullYear();
    let calViewMonth = new Date().getMonth();

    // 記録用GAS URLの事前診断チェック
    function validateRecordGasUrl() {
      const url = (RECORD_GAS_URL || "").trim();
      if (!url || url.includes("YYYYY") || url.includes("XXXXX")) {
        return "⚠️ HTML内の RECORD_GAS_URL がサンプル(YYYYY)のままです！記録用GASのURLに書き換えてください。";
      }
      if (url === (GAS_URL || "").trim()) {
        return "⚠️ RECORD_GAS_URL にログイン用と同じURLが入っています！記録シート側のURLを貼ってください。";
      }
      if (url.endsWith("/dev")) {
        return "⚠️ RECORD_GAS_URL がテスト用(/dev)です！本番デプロイ(/exec)のURLを貼ってください。";
      }
      return null;
    }

    function unlockApp() {
      document.getElementById("login-screen").style.display = "none";
      setTimeout(() => {
        map.invalidateSize();
        fetchAllUserRecords(false);
      }, 150);
    }

    async function attemptLogin(isAuto = false) {
      const idInput = document.getElementById("login-id");
      const passInput = document.getElementById("login-pass");
      const msg = document.getElementById("login-msg");
      const btn = document.getElementById("login-btn");

      const id = idInput.value.trim();
      const pass = passInput.value.trim();

      if (!id || !pass) {
        if (!isAuto) msg.innerText = "IDとパスワードを入力してください";
        return;
      }

      btn.innerText = isAuto ? "認証確認中..." : "ログイン中...";
      btn.disabled = true;
      msg.innerText = "";

      try {
        const url = `${GAS_URL}?id=${encodeURIComponent(id)}&pass=${encodeURIComponent(pass)}`;
        const res = await fetch(url);
        const text = await res.text();
        
        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          msg.innerText = "⚠️ Google側でブロックされました（URL確認）";
          btn.innerText = "ログイン";
          btn.disabled = false;
          return;
        }

        if (data.success) {
          localStorage.setItem("pin_auth_id", id);
          localStorage.setItem("pin_auth_pass", pass);
          unlockApp();
        } else {
          localStorage.removeItem("pin_auth_id");
          localStorage.removeItem("pin_auth_pass");
          msg.innerText = "❌ " + data.msg;
          btn.innerText = "ログイン";
          btn.disabled = false;
        }
      } catch (err) {
        if (isAuto && localStorage.getItem("pin_auth_id")) {
          unlockApp();
        } else {
          msg.innerText = "通信エラー: " + err.message;
          btn.innerText = "ログイン";
          btn.disabled = false;
        }
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const savedId = localStorage.getItem("pin_auth_id");
      const savedPass = localStorage.getItem("pin_auth_pass");
      if (savedId && savedPass) {
        document.getElementById("login-id").value = savedId;
        document.getElementById("login-pass").value = savedPass;
        attemptLogin(true);
      }
    });

    document.getElementById("login-pass").addEventListener("keypress", (e) => {
      if (e.key === "Enter") attemptLogin(false);
    });

    // --- 🗺️ 地図初期化 ---
    let initLat = 35.681236;
    let initLon = 139.767125;
    let initZoom = 17;
    try {
      const saved = JSON.parse(localStorage.getItem('pin_copy_last_view'));
      if (saved && saved.lat && saved.lon) {
        initLat = saved.lat;
        initLon = saved.lon;
        initZoom = saved.zoom || 17;
      }
    } catch(e) {}

    const map = L.map('map', { zoomControl: false }).setView([initLat, initLon], initZoom);
    L.control.zoom({ position: 'topleft' }).addTo(map);

    const gsiPhoto = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {
      maxNativeZoom: 18,
      maxZoom: 20,
      attribution: '国土地理院'
    }).addTo(map);

    const gsiStd = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
      maxNativeZoom: 18,
      maxZoom: 20,
      attribution: '国土地理院'
    });

    const gsiPale = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
      maxNativeZoom: 18,
      maxZoom: 20,
      attribution: '国土地理院'
    });

    L.control.layers(
      { "📡 航空写真": gsiPhoto, "🗺️ 標準地図": gsiStd, "⚪ 淡色地図": gsiPale },
      null,
      { position: 'topright' }
    ).addTo(map);

    let gpsBtnEl = null;
    const gpsControl = L.control({ position: 'bottomright' });

    function updateCenterDisplay() {
      const c = map.getCenter();
      currentCoordText = `${c.lat.toFixed(6)}, ${c.lng.toFixed(6)}`;
      document.getElementById('coord-display').innerText = currentCoordText;

        }));

    function getJstTodayKey(offsetDays = 0) {
      const now = new Date();
      const jstMs = now.getTime() + 9 * 3600 * 1000 + offsetDays * 86400 * 1000;
      const d = new Date(jstMs);
      const y = d.getUTCFullYear();
      const m = String(d.getUTCMonth() + 1).padStart(2, '0');
      const day = String(d.getUTCDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    window.focusOnPin = function(lat, lon) {
      map.setView([lat, lon], 19);
      map.closePopup();
    };

    window.copyPinCoord = function(text) {
      const status = document.getElementById('last-copied');
      const done = () => { status.innerText = `📋 コピー済み: ${text}`; };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
    };

    window.deletePinRecord = async function(uid) {
      const urlErr = validateRecordGasUrl();
      if (urlErr) { alert(urlErr); return; }

      const item = allUserRecords.find(r => r._uid === uid);
      if (!item) return;

      const ok = confirm(`管理番号「${item.manageId}」（${item.recordDate}）をスプレッドシートから完全に削除しますか？`);
      if (!ok) return;

      map.closePopup();
      const statusEl = document.getElementById("last-copied");
      const author = localStorage.getItem("pin_auth_id") || "";

      statusEl.style.color = "#c62828";
      statusEl.innerText = `⏳ 「${item.manageId}」を削除中...`;

      try {
        const url = `${RECORD_GAS_URL.trim()}?action=delete&author=${encodeURIComponent(author)}&manageId=${encodeURIComponent(item.manageId)}&lat=${encodeURIComponent(item.lat)}&lon=${encodeURIComponent(item.lon)}&recordDate=${encodeURIComponent(item.recordDate)}`;
        const res = await fetch(url);
        const text = await res.text();

        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error("記録用GASのアクセス権を「全員」にして新バージョンでデプロイしてください");
        }

        if (data.success) {
          allUserRecords = allUserRecords.filter(r => r._uid !== uid);
          applyHistoryFilter(false);
          statusEl.style.color = "#c62828";
          statusEl.innerText = `🗑️ 削除完了！ [${item.manageId}]`;
        } else {
          statusEl.style.color = "#c62828";
          statusEl.innerText = `❌ 削除失敗: ${data.msg}`;
          alert("削除に失敗しました:\n" + data.msg);
        }
      } catch (err) {
        statusEl.style.color = "#c62828";
        statusEl.innerText = `❌ 削除通信エラー: ${err.message}`;
        alert("削除通信エラー:\n" + err.message);
      } finally {
        setTimeout(() => { statusEl.style.color = "#546e7a"; }, 5000);
      }
    };

    function addHistoryMarker(item, autoOpen = false) {
      const lat = Number(item.lat);
      const lon = Number(item.lon);
      const coordStr = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
      const safeId = escapeHtml(item.manageId);
      const safeDate = escapeHtml(item.recordDate);

      const marker = L.circleMarker([lat, lon], {
        radius: 9,
        fillColor: "#2e7d32",
        color: "#ffffff",
        weight: 3,
        fillOpacity: 1
      });

      marker.bindTooltip(safeId, {
        permanent: true,
        direction: "top",
        offset: [0, -10],
        className: "history-label"
      });

      marker.bindPopup(`
        <div style="font-size:13px; line-height:1.45; min-width:170px;">
          <b>📌 ${safeId}</b><br>
          <span style="color:#555;">🕒 ${safeDate}</span><br>
          <span style="font-family:monospace;">${coordStr}</span>
          <button class="popup-btn" onclick="focusOnPin(${lat}, ${lon})">🎯 ここに照準を合わせる</button>
          <button class="popup-btn" style="background:#2e7d32;" onclick="copyPinCoord('${coordStr}')">📋 この座標をコピー</button>
          <button class="popup-btn popup-btn-del" onclick="deletePinRecord(${item._uid})">🗑️ この記録を削除</button>
        </div>
      `);

      historyLayer.addLayer(marker);
      if (autoOpen) marker.openPopup();
      return marker;
    }

    async function fetchAllUserRecords(fitBoundsAfterLoad = false) {
      const author = localStorage.getItem("pin_auth_id");
      const statusEl = document.getElementById("last-copied");
      if (!author) return;

      const urlErr = validateRecordGasUrl();
      if (urlErr) {
        statusEl.style.color = "#c62828";
        statusEl.innerText = urlErr;
        return;
      }

      statusEl.innerText = "📡 登録履歴を読み込み中...";

      try {
        const url = `${RECORD_GAS_URL.trim()}?action=get_history&author=${encodeURIComponent(author)}`;
        const res = await fetch(url);
        const text = await res.text();

        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          statusEl.style.color = "#c62828";
          statusEl.innerText = "⚠️ 記録用GASがブロックされました（アクセス権を「全員」にしてください）";

          statusEl.style.color = "#c62828";

          return;
        }

        statusEl.style.color = "#546e7a";
        allUserRecords = (data.items || []).map(item => ({
          ...item,
          _uid: ++recordUidCounter
        }));
        applyHistoryFilter(fitBoundsAfterLoad);
      } catch (err) {
        statusEl.style.color = "#c62828";
        statusEl.innerText = `⚠️ 履歴通信エラー: ${err.message}（RECORD_GAS_URLを確認）`;

    function onPeriodSelectChange() {
      const val = document.getElementById("history-select").value;
      if (val !== "custom_date") {
        selectedDateKey = "";
        document.getElementById("calendar-btn").classList.remove("active-date");
        document.getElementById("custom-date-opt").style.display = "none";
      }
      applyHistoryFilter(true);
    }

    function applyHistoryFilter(fitBoundsAfterLoad = true) {
      const period = document.getElementById("history-select").value;
      const statusEl = document.getElementById("last-copied");
      const author = localStorage.getItem("pin_auth_id") || "";

      historyLayer.clearLayers();
      currentVisibleRecords = [];

      if (period === "none") {
        statusEl.innerText = "履歴ピンを非表示にしました";
        return;
      }

      const todayKey = getJstTodayKey(0);
      const yesterdayKey = getJstTodayKey(-1);
      const now = new Date();
      const jstMs = now.getTime() + 9 * 3600 * 1000;
      const d = new Date(jstMs);
      const y = d.getUTCFullYear();
      const m = d.getUTCMonth();
      const day = d.getUTCDate();

      const week1StartMs = Date.UTC(y, m, day - 7) - 9 * 3600 * 1000;
      const month1StartMs = Date.UTC(y, m - 1, day) - 9 * 3600 * 1000;
      const month3StartMs = Date.UTC(y, m - 3, day) - 9 * 3600 * 1000;
      const year1StartMs = Date.UTC(y - 1, m, day) - 9 * 3600 * 1000;

      const filtered = allUserRecords.filter(item => {
        if (period === "all") return true;
        if (period === "custom_date") return item.dateKey === selectedDateKey;
        if (period === "today") return item.dateKey === todayKey;
        if (period === "yesterday") return item.dateKey === yesterdayKey;

        if (!item.timestamp) return false;
        if (period === "1week") return item.timestamp >= week1StartMs;
        if (period === "1month") return item.timestamp >= month1StartMs;
        if (period === "3months") return item.timestamp >= month3StartMs;
        if (period === "1year") return item.timestamp >= year1StartMs;
        return false;
      });

      currentVisibleRecords = filtered;

      if (filtered.length === 0) {
        const label = period === "custom_date" ? `${selectedDateKey.replace(/-/g, '/')} の` : "該当期間の";
        statusEl.innerText = `${label}登録データはありません（0件）`;
        return;
      }

      const latLngs = [];
      filtered.forEach(item => {
        addHistoryMarker(item, false);
        latLngs.push([item.lat, item.lon]);
      });

      const periodLabel = period === "custom_date" ? `${selectedDateKey.replace(/-/g, '/')}` : "";
      statusEl.innerText = `📍 [${author}] ${periodLabel} 履歴: ${filtered.length}件表示中`;

      if (fitBoundsAfterLoad && latLngs.length > 0) {
        if (latLngs.length === 1) {
          map.setView(latLngs[0], 17);
        } else {
          map.fitBounds(L.latLngBounds(latLngs), { padding: [50, 50], maxZoom: 18 });
        }
      }
    }

    function exportVisiblePinsToExcel() {
      if (typeof XLSX === "undefined") {
        alert("Excel出力ライブラリの読み込み中です。数秒待ってからもう一度お試しください。");
        return;
      }

      const period = document.getElementById("history-select").value;

        alert("出力できるピンが地図に表示されていません。\n右上の「履歴」から表示したい期間や日付を選択してください。");
        return;
      }

      const author = localStorage.getItem("pin_auth_id") || "user";
      const statusEl = document.getElementById("last-copied");

      const periodNameMap = {
        today: "本日",
        yesterday: "昨日",
        "1week": "過去1週間",
        "1month": "過去1か月",
        "3months": "過去3か月",
        "1year": "過去1年",
        all: "全期間",
        custom_date: selectedDateKey || "日付指定"
      };
      const periodTag = (periodNameMap[period] || "履歴").replace(/[\\/:*?"<>|]/g, "-");
      const todayCompact = getJstTodayKey(0).replace(/-/g, "");

      const sheetRows = currentVisibleRecords.map(item => ({
        "管理番号": item.manageId,
        "緯度": Number(Number(item.lat).toFixed(6)),
        "経度": Number(Number(item.lon).toFixed(6)),
        "作成者": author,
        "記録日": item.recordDate
      }));

      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(sheetRows);

      ws["!cols"] = [
        { wch: 20 },
        { wch: 13 },
        { wch: 14 },
        { wch: 14 },
        { wch: 20 }
      ];

      XLSX.utils.book_append_sheet(wb, ws, "記録シート");

      const fileName = `現場座標_${author}_${periodTag}_${todayCompact}.xlsx`;
      XLSX.writeFile(wb, fileName);

      statusEl.style.color = "#00695c";
      statusEl.innerText = `📊 Excel出力完了！（${sheetRows.length}件: ${fileName}）`;
      setTimeout(() => { statusEl.style.color = "#546e7a"; }, 4500);
    }

    // =========================================================================

    function openCalendar() {
      if (selectedDateKey) {
        const parts = selectedDateKey.split("-");
        calViewYear = Number(parts[0]);
        calViewMonth = Number(parts[1]) - 1;
      } else {
        const datedRecords = allUserRecords.filter(r => r.dateKey);
        if (datedRecords.length > 0) {
          datedRecords.sort((a, b) => b.dateKey.localeCompare(a.dateKey));
          const latestParts = datedRecords[0].dateKey.split("-");
          calViewYear = Number(latestParts[0]);
          calViewMonth = Number(latestParts[1]) - 1;
        } else {
          const todayParts = getJstTodayKey(0).split("-");
          calViewYear = Number(todayParts[0]);
          calViewMonth = Number(todayParts[1]) - 1;
        }
      }

      renderCalendar();
      document.getElementById("calendar-modal").style.display = "flex";
    }

    function closeCalendar() {
      document.getElementById("calendar-modal").style.display = "none";
    }

    function closeCalendarIfBackdrop(e) {
      if (e.target.id === "calendar-modal") closeCalendar();
    }

    function changeCalMonth(delta) {
      calViewMonth += delta;
      if (calViewMonth < 0) {
        calViewMonth = 11;
        calViewYear--;
      } else if (calViewMonth > 11) {
        calViewMonth = 0;
        calViewYear++;
      }
      renderCalendar();
    }

    function renderCalendar() {
      document.getElementById("cal-month-title").innerText = `${calViewYear}年 ${calViewMonth + 1}月`;

      const countMap = {};
      allUserRecords.forEach(item => {
        if (item.dateKey) {
          countMap[item.dateKey] = (countMap[item.dateKey] || 0) + 1;
        }
      });

      const grid = document.getElementById("cal-grid");
      grid.innerHTML = "";

      const firstDayOfWeek = new Date(calViewYear, calViewMonth, 1).getDay();
      const daysInMonth = new Date(calViewYear, calViewMonth + 1, 0).getDate();
      const todayKey = getJstTodayKey(0);
      let monthTotalCount = 0;

      for (let i = 0; i < firstDayOfWeek; i++) {
        const emptyDiv = document.createElement("div");
        emptyDiv.className = "cal-cell empty";
        grid.appendChild(emptyDiv);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const mStr = String(calViewMonth + 1).padStart(2, '0');
        const dStr = String(d).padStart(2, '0');
        const dateKey = `${calViewYear}-${mStr}-${dStr}`;
        const count = countMap[dateKey] || 0;
        monthTotalCount += count;

        const cell = document.createElement("div");
        cell.className = "cal-cell";

        if (dateKey === todayKey) cell.classList.add("is-today");
        if (dateKey === selectedDateKey) cell.classList.add("selected");

        if (count > 0) {
          cell.classList.add("has-data");
          cell.innerHTML = `<span>${d}</span><span class="cal-badge">●${count}</span>`;
          cell.onclick = () => selectDateFromCalendar(dateKey);
        } else {
          cell.classList.add("no-data");
          cell.innerHTML = `<span>${d}</span>`;
        }

        grid.appendChild(cell);
      }

      document.getElementById("cal-total-badge").innerText = `当月計: ${monthTotalCount}件`;
    }

    function selectDateFromCalendar(dateKey) {
      selectedDateKey = dateKey;
      const opt = document.getElementById("custom-date-opt");
      opt.style.display = "block";
      opt.text = `📅 ${dateKey.slice(5).replace('-', '/')}`;
      document.getElementById("history-select").value = "custom_date";
      document.getElementById("calendar-btn").classList.add("active-date");

      closeCalendar();
      applyHistoryFilter(true);
    }

    function selectTodayFromCal() {
      selectedDateKey = "";
      document.getElementById("custom-date-opt").style.display = "none";
      document.getElementById("history-select").value = "today";
      document.getElementById("calendar-btn").classList.remove("active-date");

      closeCalendar();
      applyHistoryFilter(true);
    }

    async function registerSpot() {

        return;
      }

      const c = map.getCenter();
      const lat = c.lat.toFixed(6);
      const lon = c.lng.toFixed(6);
      const author = localStorage.getItem("pin_auth_id") || "未設定";

      btnEl.disabled = true;
      btnEl.innerText = "⏳ 送信中";
      statusEl.innerText = `📡 「${manageId}」をスプレッドシートへ記録中...`;

      try {
        const url = `${RECORD_GAS_URL.trim()}?action=register&manageId=${encodeURIComponent(manageId)}&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&author=${encodeURIComponent(author)}`;
        const res = await fetch(url);
        const text = await res.text();

        let data;

          data = JSON.parse(text);
        } catch (e) {
          throw new Error("記録用GASのアクセス権を「全員」にしてデプロイしてください");
        }

        if (data.success) {
          const newItem = {
            _uid: ++recordUidCounter,
            manageId: manageId,
            lat: parseFloat(lat),
            lon: parseFloat(lon),
            recordDate: data.recordDate || "たった今",
            dateKey: data.dateKey || getJstTodayKey(0),
            timestamp: data.timestamp || Date.now()
          };

          allUserRecords.push(newItem);

          if (document.getElementById("history-select").value !== "none") {
            currentVisibleRecords.push(newItem);
            addHistoryMarker(newItem, true);
          }

          statusEl.style.color = "#1b5e20";
          statusEl.innerText = `✅ 登録完了！ [${manageId}] (${newItem.recordDate})`;
          inputEl.value = "";
          inputEl.blur();
        } else {
          statusEl.style.color = "#c62828";
          statusEl.innerText = `❌ 登録失敗: ${data.msg}`;
          alert("登録に失敗しました:\n" + data.msg);
        }
      } catch (err) {
        statusEl.style.color = "#c62828";
        statusEl.innerText = `❌ 登録通信エラー: ${err.message}`;
        alert("通信エラーが発生しました:\n" + err.message);
      } finally {
        btnEl.disabled = false;
        btnEl.innerText = "💾 登録";
        setTimeout(() => { statusEl.style.color = "#546e7a"; }, 5000);
      }
    }

    function copyCenterCoord() {
      const text = currentCoordText;
      const btn = document.getElementById('copy-btn');
      const status = document.getElementById('last-copied');

      const onSuccess = () => {
        btn.classList.add('copied');
        btn.innerText = `✅ コピー完了！`;
        status.innerText = `コピー済み: ${text}`;
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerText = `📋 座標コピー`;
        }, 1800);
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(onSuccess).catch(() => fallbackCopy(text, onSuccess));
      } else {
        fallbackCopy(text, onSuccess);
      }
    }

    function fallbackCopy(text, callback) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        callback();
      } catch(e) {
        alert("コピーに失敗しました。上の数字を長押ししてコピーしてください:\n" + text);
      }
      document.body.removeChild(ta);
    }

    function stopGpsWatch(msgText) {
      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
      }
      if (gpsStopTimer !== null) {
        clearTimeout(gpsStopTimer);
        gpsStopTimer = null;
      }
      if (gpsBtnEl) gpsBtnEl.classList.remove('tracking');
      if (msgText) {
        document.getElementById('last-copied').innerText = msgText;
      }
    }

    function jumpToCurrentLocation() {
      const status = document.getElementById('last-copied');
      if (!navigator.geolocation) {
        alert("お使いのブラウザはGPSに対応していません。");
        return;
      }

      stopGpsWatch();
      if (gpsBtnEl) gpsBtnEl.classList.add('tracking');
      status.innerText = "🛰️ GPS衛星を捕捉中...（最大10秒間絞り込み）";

      let bestAccuracy = Infinity;
      let latestAcc = null;

      gpsWatchId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const acc = pos.coords.accuracy;
          latestAcc = Math.round(acc);

          if (acc <= bestAccuracy) {
            bestAccuracy = acc;
            const targetZoom = acc <= 15 ? 19 : 18;
            map.setView([lat, lon], targetZoom);

            if (myLocMarker) map.removeLayer(myLocMarker);
            if (myLocCircle) map.removeLayer(myLocCircle);

            myLocCircle = L.circle([lat, lon], {
              radius: acc,
              color: "#0288d1",
              weight: 1,
              fillColor: "#03a9f4",
              fillOpacity: 0.18
            }).addTo(map);

            myLocMarker = L.circleMarker([lat, lon], {
              radius: 8,
              fillColor: "#0288d1",
              color: "#ffffff",
              weight: 3,
              fillOpacity: 1
            }).bindPopup(`📍 現在地（誤差約${latestAcc}m）`).addTo(map);

            if (acc <= 6) {
              stopGpsWatch(`🎯 高精度ロック完了！（誤差約${latestAcc}m）`);
            } else {
              status.innerText = `🛰️ 精密測位中... 現在誤差: 約${latestAcc}m（さらに絞り込み中）`;
            }
          }
        },
        (err) => {
          stopGpsWatch("⚠️ 位置情報を取得できませんでした");
          alert("現在地を取得できませんでした。スマホの「正確な位置情報」設定をご確認ください。");
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );

      gpsStopTimer = setTimeout(() => {
        if (gpsWatchId !== null) {
          const finalMsg = latestAcc !== null
            ? `✅ 現在地確定（誤差約${Math.round(bestAccuracy)}m）`
            : "⚠️ タイムアウトしました";
          stopGpsWatch(finalMsg);
        }
      }, 10000);
    }

    function parseSearchCoord(rawInput) {
      const normalized = rawInput
        .replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
        .replace(/．/g, '.')
        .replace(/，/g, ',')
        .replace(/－/g, '-')
        .replace(/ /g, ' ')
        .trim();

      const matches = normalized.match(/[-+]?\d+\.\d+/g);
      if (matches && matches.length >= 2) {
        let n1 = parseFloat(matches[0]);
        let n2 = parseFloat(matches[1]);

        if (n1 >= 120 && n1 <= 155 && n2 >= 20 && n2 <= 50) {
          return { lat: n2, lon: n1 };
        }
        if (Math.abs(n1) <= 90 && Math.abs(n2) <= 180) {
          return { lat: n1, lon: n2 };
        }
      }
      return null;
    }

    async function handleSearch() {
      const q = document.getElementById('search-input').value.trim();
      if (!q) return;

      stopGpsWatch();
      const status = document.getElementById('last-copied');

      const coord = parseSearchCoord(q);
      if (coord) {
        map.setView([coord.lat, coord.lon], 19);

        if (searchMarker) map.removeLayer(searchMarker);
        searchMarker = L.circleMarker([coord.lat, coord.lon], {
          radius: 9,
          fillColor: "#ef6c00",
          color: "#ffffff",
          weight: 3,
          fillOpacity: 1
        }).bindPopup(`📌 検索座標<br>${coord.lat.toFixed(6)}, ${coord.lon.toFixed(6)}`).addTo(map).openPopup();

        status.innerText = `📌 座標へ移動しました: ${coord.lat.toFixed(6)}, ${coord.lon.toFixed(6)}`;
        document.getElementById('search-input').blur();
        return;
      }

      status.innerText = "🔍 住所検索中...";
      try {
        const res = await fetch(`https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        if (data && data.length > 0 && data[0].geometry) {
          const coords = data[0].geometry.coordinates;
          const lat = coords[1];
          const lon = coords[0];
          const title = data[0].properties.title || q;

          map.setView([lat, lon], 18);

          if (searchMarker) map.removeLayer(searchMarker);
          searchMarker = L.circleMarker([lat, lon], {
            radius: 9,
            fillColor: "#ef6c00",
            color: "#ffffff",
            weight: 3,
            fillOpacity: 1
          }).bindPopup(`📌 ${title}`).addTo(map).openPopup();

          status.innerText = `移動完了: ${title}`;
          document.getElementById('search-input').blur();
        } else {
          status.innerText = "住所・施設が見つかりませんでした";
          alert("住所・施設が見つかりませんでした。");
        }
      } catch(e) {
        status.innerText = "検索エラーが発生しました";
      }
    }

    document.getElementById('search-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') handleSearch();
    });
  </script>
</body>
